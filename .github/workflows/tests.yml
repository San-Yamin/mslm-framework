name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run automated tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Verify deterministic evidence generation
        env:
          PYTHONPATH: src
        run: >-
          python -m mslm.experiments
          --iterations 1000
          --benchmark-iterations 1000
          --seed 2026
          --output /tmp/mslm-results
